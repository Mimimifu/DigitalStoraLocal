<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Pix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 32px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #eef2f6;
        }

        .logo-pix {
            width: 80px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.2rem;
            color: #333333;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #666666;
            margin-bottom: 24px;
        }

        .qrcode-container {
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        </style>

        </div>

        <h2 class="title">Pague com o Pix</h2>
        <p class="subtitle">Escaneie o código acima ou copie a chave Pix abaixo.</p>

        <!-- Campo Manual (Para garantir a cópia caso o botão falhe) -->
        <div class="manual-copy-box">
            <input type="text" id="pixKeyValue" value="2c04642f-fbb7-4b0f-9efb-434184b133f4" readonly onclick="this.select();">
        </div>

        <!-- Botão Principal de Cópia Automática -->
        <button class="btn-copy" id="copyBtn" onclick="copyPixKey()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            Copiar Chave Pix
        </button>

        <div class="success-toast" id="successMessage">Chave Pix copiada com sucesso!</div>
    </div>

    <script>
        function copyPixKey() {
            const inputKey = document.getElementById('pixKeyValue');
            
            // Tenta a API moderna primeiro
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(inputKey.value).then(() => {
                    showToast();
                }).catch(err => {
                    fallbackCopy(inputKey);
                });
            } else {
                // Fallback para navegadores antigos ou sem HTTPS
                fallbackCopy(inputKey);
            }
        }

        function fallbackCopy(inputElement) {
            inputElement.select();
            inputElement.setSelectionRange(0, 99999); // Para dispositivos móveis
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                alert('Por favor, selecione o texto do campo manualmente e copie.');
            }
        }

        function showToast() {
            const toast = document.getElementById('successMessage');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>

</body>
</html>

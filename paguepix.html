<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Pix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 32px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #eef2f6;
        }

        .logo-pix {
            width: 80px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.2rem;
            color: #333333;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #666666;
            margin-bottom: 24px;
        }

        .qrcode-container {
            background: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }

        .qrcode-container svg {
            display: block;
        }

        .btn-copy {
            background-color: #32b1a4;
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-copy:hover {
            background-color: #2a968b;
        }

        .btn-copy:active {
            transform: scale(0.98);
        }

        .success-toast {
            font-size: 0.85rem;
            color: #10b981;
            margin-top: 12px;
            font-weight: 500;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo do Pix aproximada em SVG -->
        <svg class="logo-pix" viewBox="0 0 120 45" fill="none" xmlns="http://w3.org">
            <path d="M38.7 18.3c0-4.2-3.4-7.6-7.6-7.6H13.6v23.5h7.5V24.5h10c4.2 0 7.6-3.4 7.6-7.6v1.4z" fill="#32B1A4"/>
            <path d="M13.6 10.7h17.5c4.2 0 7.6 3.4 7.6 7.6v-1.4c0-4.2-3.4-7.6-7.6-7.6H13.6v1.4z" fill="#32B1A4"/>
            <path d="M49.2 10.7h7.5v23.5h-7.5V10.7zM64 10.7l9.4 11.2 9.4-11.2h8.8L79.4 22.5l12.2 11.7h-8.8L73.4 23.8l-9.4 10.4H55.2l12.2-11.7L58 10.7H64z" fill="#32B1A4"/>
            <path d="M15.4 39L5 28.6l10.4-10.4L25.8 28.6 15.4 39z" fill="#32B1A4"/>
        </svg>

        <h2 class="title">Pague com o Pix</h2>
        <p class="subtitle">Abra o app do seu banco e aponte a câmera para o QR Code ou copie a chave abaixo.</p>

        <!-- Container do QR Code (Ilustração SVG simulando um QR Code real) -->
        <div class="qrcode-container">
            <svg width="180" height="180" viewBox="0 0 29 29" fill="none" xmlns="http://w3.org" shape-rendering="crispEdges">
                <path fill="#ffffff" d="M0 0h29v29H0z"/>
                <path fill="#000000" d="M0 0h7v7H0zm22 0h7v7h-7zM0 22h7v7H0zm2 2h3v3H2zM24 2h3v3h-3zM2 2h3v3H2zm17 1h2v1h-2zm-3 2h2v1h-2zm4 2h1v1h-1zm-9 1h3v1h-3zm5 1h1v2h-1zm-4 2h1v1h-1zm2 1h1v1h-1zm-5 1h2v1h-2zm9 0h2v1h-2zm-12 2h1v1h-1zm5 0h1v2h-1zm4 1h1v1h-1zm-6 2h2v1h-2zm9 0h2v1h-2zm-5 2h1v1h-1zm3 1h2v1h-2zm-9 1h1v1h-1zm4 0h1v1h-1z"/>
                <path fill="#000000" d="M0 0h1v7H0zm6 0h1v7H6ZM0 0h7v1H0zm0 6h7v1H0zm22 -6h1v7h-1zm6 0h1v7h-1zm-6 0h7v1h-7zm0 6h7v1h-7zM0 22h1v7H0zm6 0h1v7H6ZM0 22h7v1H0zm0 6h7v1H0z"/>
            </svg>
        </div>

        <!-- Botão Copiar Chave -->
        <button class="btn-copy" id="copyBtn" onclick="copyPixKey()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            Copiar Chave Pix
        </button>

        <div class="success-toast" id="successMessage">Chave Pix copiada com sucesso!</div>

        <div>2c04642f-fbb7-4b0f-9efb-434184b133f4</div>
    </div>

    <script>
        const pixKey = "2c04642f-fbb7-4b0f-9efb-434184b133f4";

        function copyPixKey() {
            navigator.clipboard.writeText(pixKey).then(() => {
                const toast = document.getElementById('successMessage');
                toast.style.display = 'block';
                
                // Esconde a mensagem de sucesso após 3 segundos
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 3000);
            }).catch(err => {
                console.error('Erro ao copiar texto: ', err);
            });
        }
    </script>

</body>
</html>

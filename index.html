<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Loja de produtos digitais.">
    
    <meta name="color-scheme" content="light dark">
    <title>Digital Store</title>
    <style>
/* ==== global.css ==== */
/* ============================================================================
   Digital Store Pro v6 — Design System
   Tokens, reset, layout e primitivos de UI.
   Única folha de estilos carregada; o build a embute no index.html final.
   ========================================================================= */

/* ---------------------------------------------------------------- Tokens --- */
:root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: rgba(37, 99, 235, 0.12);

    --success: #16a34a;
    --success-soft: rgba(22, 163, 74, 0.12);
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.12);
    --warning: #d97706;
    --warning-soft: rgba(217, 119, 6, 0.14);

    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface-alt: #f8fafc;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;

    --radius-sm: 6px;
    --radius: 12px;
    --radius-lg: 18px;

    --shadow-sm: 0 1px 2px rgb(15 23 42 / 0.06);
    --shadow: 0 4px 12px -2px rgb(15 23 42 / 0.10);
    --shadow-lg: 0 18px 40px -12px rgb(15 23 42 / 0.24);

    --sidebar-width: 264px;
    --sidebar-collapsed-width: 72px;
    --header-height: 68px;

    /* Transições suaves em "slow motion", conforme o design system do projeto. */
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --transition: 400ms var(--ease);
    --transition-slow: 700ms var(--ease);

    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono: ui-monospace, 'SFMono-Regular', 'Cascadia Code', Menlo, monospace;
}

/* O acento é sobrescrito em runtime pelas Configurações (--accent-color). */
:root {
    --accent: var(--accent-color, var(--primary));
}

[data-theme='dark'] {
    --bg: #0b1220;
    --surface: #151f33;
    --surface-alt: #1c2740;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #2b3a55;

    --primary-soft: rgba(96, 165, 250, 0.16);
    --success-soft: rgba(34, 197, 94, 0.16);
    --danger-soft: rgba(248, 113, 113, 0.16);
    --warning-soft: rgba(251, 191, 36, 0.16);

    --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.4);
    --shadow: 0 4px 12px -2px rgb(0 0 0 / 0.5);
    --shadow-lg: 0 18px 40px -12px rgb(0 0 0 / 0.7);
}

/* ------------------------------------------------------- Reset & base ------ */
*,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: var(--font);
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    transition: background-color var(--transition), color var(--transition);
}

h1, h2, h3, h4 {
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -0.015em;
}

h1 { font-size: 1.5rem; }
h2 { font-size: 1.65rem; }
h3 { font-size: 1.1rem; }

a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

img { max-width: 100%; display: block; }

/* Foco visível consistente — requisito de acessibilidade. */
:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--radius-sm);
}

/* ------------------------------------------------------------ A11y helpers - */
.visually-hidden,
.skip-link:not(:focus) {
    position: absolute !important;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

.skip-link {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 2000;
    padding: 0.6rem 1rem;
    background: var(--primary);
    color: #fff;
    border-radius: var(--radius-sm);
    font-weight: 600;
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
}

/* Filtros de daltonismo (requisito de acessibilidade do projeto). */
[data-colorblind='protanopia'] { filter: url('#cb-protanopia'); }
[data-colorblind='deuteranopia'] { filter: url('#cb-deuteranopia'); }
[data-colorblind='tritanopia'] { filter: url('#cb-tritanopia'); }
[data-colorblind='acromatopsia'] { filter: grayscale(1); }

/* -------------------------------------------------------------- Layout ---- */
.app-shell {
    display: grid;
    grid-template-areas:
        'sidebar header'
        'sidebar main';
    grid-template-columns: var(--sidebar-width) 1fr;
    grid-template-rows: var(--header-height) 1fr;
    min-height: 100vh;
    transition: grid-template-columns var(--transition);
}

.app-shell[data-sidebar-side='right'] {
    grid-template-areas:
        'header sidebar'
        'main   sidebar';
    grid-template-columns: 1fr var(--sidebar-width);
}

.app-shell[data-collapsed='true'] {
    grid-template-columns: var(--sidebar-collapsed-width) 1fr;
}

.app-shell[data-sidebar-side='right'][data-collapsed='true'] {
    grid-template-columns: 1fr var(--sidebar-collapsed-width);
}

.app-shell--store {
    grid-template-areas: 'header' 'main';
    grid-template-columns: 1fr;
}

.app-shell__header { grid-area: header; }
.app-shell__sidebar { grid-area: sidebar; }
.app-shell__main { grid-area: main; }

.app-shell__main {
    padding: 2rem clamp(1rem, 3vw, 2.5rem) 3rem;
    min-width: 0;
}

.page {
    max-width: 1240px;
    margin: 0 auto;
    animation: fade-in var(--transition-slow) both;
}

@keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
}

/* -------------------------------------------------------------- Header ---- */
.header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0 1.5rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
    transition: background-color var(--transition), border-color var(--transition);
}

.header__brand {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: -0.02em;
    white-space: nowrap;
}

.header__logo {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), #7c3aed);
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 1rem;
    flex-shrink: 0;
}

.header__spacer { flex: 1; }

.header__actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.header__title {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 500;
    white-space: nowrap;
}

/* ------------------------------------------------------------- Sidebar ---- */
.sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 1rem 0.75rem;
    gap: 0.35rem;
    overflow-x: hidden;
    overflow-y: auto;
    transition: background-color var(--transition), border-color var(--transition);
}

.app-shell[data-sidebar-side='right'] .sidebar {
    border-right: none;
    border-left: 1px solid var(--border);
}

.sidebar__section-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-muted);
    padding: 0.85rem 0.65rem 0.35rem;
    font-weight: 700;
}

.app-shell[data-collapsed='true'] .sidebar__section-label {
    opacity: 0;
    height: 0;
    padding: 0;
    overflow: hidden;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.7rem 0.75rem;
    border-radius: var(--radius-sm);
    color: var(--text);
    font-weight: 500;
    font-size: 0.94rem;
    cursor: pointer;
    white-space: nowrap;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    transition: background-color var(--transition), color var(--transition);
}

.nav-item:hover { background: var(--surface-alt); text-decoration: none; }

.nav-item[aria-current='page'],
.nav-item.is-active {
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 600;
}

.nav-item__icon {
    width: 22px;
    flex-shrink: 0;
    text-align: center;
    font-size: 1.05rem;
}

.nav-item__badge {
    margin-left: auto;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--surface-alt);
    color: var(--text-muted);
    border: 1px solid var(--border);
}

.app-shell[data-collapsed='true'] .nav-item {
    justify-content: center;
    padding: 0.8rem 0;
}

.app-shell[data-collapsed='true'] .nav-item__label,
.app-shell[data-collapsed='true'] .nav-item__badge {
    display: none;
}

.sidebar__footer {
    margin-top: auto;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
}

/* --------------------------------------------------------------- Cards ---- */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
}

.stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.15rem;
    box-shadow: var(--shadow-sm);
    transition: transform var(--transition), box-shadow var(--transition);
}

.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }

.stat-card__label {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 0.35rem;
}

.stat-card__value {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--text);
}

.stat-card__hint { font-size: 0.8rem; color: var(--text-muted); }

/* ------------------------------------------------ Product grid & card ----- */
.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 1.5rem;
}

.product-grid[data-density='compact'] {
    grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
    gap: 1rem;
}

.product-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-sm);
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    animation: fade-in var(--transition-slow) both;
}

.product-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-lg);
    border-color: var(--accent);
}

.product-card__media {
    position: relative;
    aspect-ratio: 16 / 10;
    background: var(--surface-alt);
    overflow: hidden;
}

.product-card__media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform var(--transition-slow);
}

.product-card:hover .product-card__media img { transform: scale(1.05); }

.product-card__placeholder {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    font-size: 2.25rem;
    color: var(--text-muted);
    background: linear-gradient(135deg, var(--surface-alt), var(--surface));
}

.product-card__body {
    padding: 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    flex: 1;
}

.product-card__title {
    font-size: 1.03rem;
    font-weight: 700;
    line-height: 1.35;
}

.product-card__desc {
    font-size: 0.86rem;
    color: var(--text-muted);
    line-height: 1.5;
}

.product-card__footer {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding-top: 0.5rem;
}

.product-card__price {
    font-size: 1.18rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.02em;
}

.product-card__price--free { color: var(--success); }

.product-card__actions { display: flex; gap: 0.4rem; }

/* -------------------------------------------------------------- Badges ---- */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.18rem 0.55rem;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
}

.badge--success { background: var(--success-soft); color: var(--success); }
.badge--warning { background: var(--warning-soft); color: var(--warning); }
.badge--danger  { background: var(--danger-soft);  color: var(--danger); }
.badge--neutral {
    background: var(--surface-alt);
    color: var(--text-muted);
    border: 1px solid var(--border);
}

.tag-list { display: flex; flex-wrap: wrap; gap: 0.35rem; }

/* -------------------------------------------------------------- Buttons --- */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    padding: 0.6rem 1.15rem;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color var(--transition), border-color var(--transition),
                color var(--transition), transform var(--transition), opacity var(--transition);
}

.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0); }

.btn:disabled,
.btn[aria-disabled='true'] {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.btn--primary { background: var(--accent); color: #fff; }
.btn--primary:hover:not(:disabled) { background: var(--primary-hover); }

.btn--outline { border-color: var(--border); background: var(--surface); }
.btn--outline:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

.btn--ghost { color: var(--text-muted); }
.btn--ghost:hover:not(:disabled) { background: var(--surface-alt); color: var(--text); }

.btn--danger { background: var(--danger); color: #fff; }
.btn--danger:hover:not(:disabled) { filter: brightness(0.92); }

.btn--success { background: var(--success); color: #fff; }

.btn--sm { padding: 0.4rem 0.8rem; font-size: 0.82rem; }
.btn--icon {
    padding: 0.5rem;
    width: 38px;
    height: 38px;
    border-radius: var(--radius-sm);
    border-color: var(--border);
    background: var(--surface);
}
.btn--block { width: 100%; }

/* --------------------------------------------------------------- Forms ---- */
.form {
    display: flex;
    flex-direction: column;
    gap: 1.15rem;
}

.form-group { display: flex; flex-direction: column; gap: 0.35rem; }

.form-label {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text);
}

.form-label__required { color: var(--danger); margin-left: 0.15rem; }

.form-control {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
    transition: border-color var(--transition), box-shadow var(--transition), background-color var(--transition);
}

.form-control:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--primary-soft);
}

.form-control[aria-invalid='true'] {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px var(--danger-soft);
}

textarea.form-control { resize: vertical; min-height: 110px; }

.form-help { font-size: 0.78rem; color: var(--text-muted); }

.form-error {
    font-size: 0.78rem;
    color: var(--danger);
    font-weight: 600;
    min-height: 1em;
}

.form-check {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    cursor: pointer;
}

.form-check input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

.form-actions {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    padding-top: 0.35rem;
}

.form-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    box-shadow: var(--shadow-sm);
}

/* ---------------------------------------------------------- Page header --- */
.page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1.5rem;
    flex-wrap: wrap;
    margin-bottom: 1.75rem;
}

.page-header__text { max-width: 62ch; }

.page-header__subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-top: 0.35rem;
}

.page-header__actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }

/* -------------------------------------------------------------- Toolbar --- */
.toolbar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
}

.toolbar__search {
    flex: 1 1 240px;
    min-width: 200px;
    position: relative;
}

.toolbar__search .form-control { padding-left: 2.35rem; }

.toolbar__search-icon {
    position: absolute;
    left: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
}

.filter-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }

.chip {
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all var(--transition);
}

.chip:hover { border-color: var(--accent); color: var(--accent); }

.chip[aria-pressed='true'] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
}

.select-inline {
    padding: 0.45rem 0.7rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
}

/* ----------------------------------------------------------- Data table --- */
.table-wrapper {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
}

.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
    min-width: 720px;
}

.data-table th,
.data-table td {
    padding: 0.8rem 1rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
}

.data-table th {
    background: var(--surface-alt);
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 700;
    white-space: nowrap;
}

.data-table tbody tr { transition: background-color var(--transition); }
.data-table tbody tr:hover { background: var(--surface-alt); }
.data-table tbody tr:last-child td { border-bottom: none; }

.data-table__thumb {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-sm);
    object-fit: cover;
    background: var(--surface-alt);
}

.data-table__title { font-weight: 600; }

.data-table__actions {
    display: flex;
    gap: 0.3rem;
    justify-content: flex-end;
}

/* ------------------------------------------------------ Product detail ---- */
.product-detail {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
    gap: clamp(1.5rem, 4vw, 3rem);
    align-items: start;
}

.product-detail__media {
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: var(--shadow);
    aspect-ratio: 4 / 3;
    display: grid;
    place-items: center;
}

.product-detail__media img { width: 100%; height: 100%; object-fit: cover; }

.product-detail__placeholder { font-size: 4rem; color: var(--text-muted); }

.product-detail__price {
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--accent);
    margin: 0.5rem 0;
}

.product-detail__meta {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 0.75rem;
}

.product-detail__description {
    color: var(--text-muted);
    line-height: 1.7;
    white-space: pre-wrap;
    margin: 1.25rem 0;
}

.product-detail__actions { display: flex; flex-direction: column; gap: 0.7rem; }

.breadcrumbs {
    display: flex;
    gap: 0.45rem;
    align-items: center;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 1.15rem;
    flex-wrap: wrap;
}

.breadcrumbs__sep { opacity: 0.5; }

/* ----------------------------------------------------------- Steps flow --- */
.flow-steps {
    display: flex;
    gap: 0.5rem;
    margin: 1.25rem 0;
    flex-wrap: wrap;
}

.flow-step {
    flex: 1 1 140px;
    padding: 0.7rem 0.9rem;
    border-radius: var(--radius-sm);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    font-size: 0.82rem;
    color: var(--text-muted);
    display: flex;
    gap: 0.5rem;
    align-items: center;
}

.flow-step[data-state='active'] {
    background: var(--primary-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
}

.flow-step[data-state='done'] {
    background: var(--success-soft);
    border-color: var(--success);
    color: var(--success);
    font-weight: 600;
}

/* ------------------------------------------------------------- Callouts --- */
.callout {
    display: flex;
    gap: 0.75rem;
    padding: 1rem 1.15rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 0.9rem;
    line-height: 1.6;
}

.callout--info    { background: var(--primary-soft); border-color: var(--accent); }
.callout--warning { background: var(--warning-soft); border-color: var(--warning); }
.callout--danger  { background: var(--danger-soft);  border-color: var(--danger); }
.callout--success { background: var(--success-soft); border-color: var(--success); }

.callout__icon { font-size: 1.15rem; flex-shrink: 0; }

/* -------------------------------------------------------------- Modals ---- */
.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgb(2 6 23 / 0.55);
    display: grid;
    place-items: center;
    padding: 1.25rem;
    z-index: 1000;
    animation: fade-in 260ms var(--ease) both;
    backdrop-filter: blur(3px);
}

.modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    max-width: 640px;
    width: 100%;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    animation: modal-in 340ms var(--ease) both;
}

@keyframes modal-in {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to   { opacity: 1; transform: none; }
}

.modal__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.15rem 1.5rem;
    border-bottom: 1px solid var(--border);
}

.modal__title { font-size: 1.1rem; font-weight: 700; }

.modal__body {
    padding: 1.5rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1.15rem;
}

.modal__footer {
    display: flex;
    gap: 0.7rem;
    justify-content: flex-end;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
}

/* -------------------------------------------------------------- Toasts ---- */
.toast-region {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    z-index: 1500;
    max-width: min(94vw, 400px);
}

.toast {
    display: flex;
    gap: 0.7rem;
    align-items: flex-start;
    padding: 0.9rem 1.05rem;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    box-shadow: var(--shadow-lg);
    font-size: 0.88rem;
    line-height: 1.5;
    animation: toast-in 340ms var(--ease) both;
}

@keyframes toast-in {
    from { opacity: 0; transform: translateX(28px); }
    to   { opacity: 1; transform: none; }
}

.toast--success { border-left-color: var(--success); }
.toast--danger  { border-left-color: var(--danger); }
.toast--warning { border-left-color: var(--warning); }

.toast__icon { font-size: 1.05rem; flex-shrink: 0; }
.toast__content { flex: 1; min-width: 0; }
.toast__title { font-weight: 700; margin-bottom: 0.15rem; }
.toast__close { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; line-height: 1; padding: 0.1rem 0.25rem; }

/* ------------------------------------------------------------ Empty state -- */
.empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3.5rem 1.5rem;
    border: 2px dashed var(--border);
    border-radius: var(--radius-lg);
    color: var(--text-muted);
    background: var(--surface);
}

.empty-state__icon { font-size: 2.75rem; margin-bottom: 0.75rem; }
.empty-state__title { font-size: 1.15rem; font-weight: 700; color: var(--text); margin-bottom: 0.35rem; }
.empty-state__text { margin-bottom: 1.25rem; max-width: 46ch; margin-inline: auto; }

/* -------------------------------------------------------- Connectivity ---- */
.connectivity {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text-muted);
    white-space: nowrap;
}

.connectivity[data-state='online'] { color: var(--success); border-color: var(--success); background: var(--success-soft); }
.connectivity[data-state='offline'] { color: var(--warning); border-color: var(--warning); background: var(--warning-soft); }

.connectivity__dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
}

/* ------------------------------------------------------- Settings panel --- */
.settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
    align-items: start;
}

.settings-group { display: flex; flex-direction: column; gap: 1rem; }

.settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--border);
}

.settings-row:last-child { border-bottom: none; }
.settings-row__label { font-weight: 600; font-size: 0.9rem; }
.settings-row__hint { font-size: 0.78rem; color: var(--text-muted); font-weight: 400; }

.switch {
    position: relative;
    width: 46px;
    height: 26px;
    border-radius: 999px;
    background: var(--border);
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color var(--transition);
}

.switch[aria-pressed='true'] { background: var(--accent); }

.switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: var(--shadow-sm);
    transition: transform var(--transition);
}

.switch[aria-pressed='true']::after { transform: translateX(20px); }

.color-swatches { display: flex; gap: 0.4rem; flex-wrap: wrap; }

.color-swatch {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    padding: 0;
    transition: transform var(--transition), border-color var(--transition);
}

.color-swatch:hover { transform: scale(1.12); }
.color-swatch[aria-pressed='true'] { border-color: var(--text); transform: scale(1.12); }

.code-editor {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    line-height: 1.6;
    min-height: 300px;
    tab-size: 2;
}

/* -------------------------------------------------- Test status indicator - */
.test-status {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.76rem;
    font-weight: 700;
    font-family: var(--font-mono);
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text-muted);
    cursor: pointer;
}

.test-status[data-state='pass'] { color: var(--success); border-color: var(--success); background: var(--success-soft); }
.test-status[data-state='fail'] { color: var(--danger);  border-color: var(--danger);  background: var(--danger-soft); }
.test-status[data-state='running'] { color: var(--accent); border-color: var(--accent); background: var(--primary-soft); }

.test-results { display: flex; flex-direction: column; gap: 1rem; }

.test-suite {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
}

.test-suite__header {
    padding: 0.6rem 0.9rem;
    background: var(--surface-alt);
    font-weight: 700;
    font-size: 0.86rem;
}

.test-case {
    display: flex;
    gap: 0.6rem;
    padding: 0.45rem 0.9rem;
    font-size: 0.84rem;
    border-top: 1px solid var(--border);
    align-items: flex-start;
}

.test-case__error { color: var(--danger); font-size: 0.78rem; font-family: var(--font-mono); }

/* ------------------------------------------------------------- Utility ---- */
.stack    { display: flex; flex-direction: column; gap: 1rem; }
.stack-sm { display: flex; flex-direction: column; gap: 0.5rem; }
.row      { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
.row-end  { justify-content: flex-end; }
.text-muted { color: var(--text-muted); }
.text-center { text-align: center; }
.mono { font-family: var(--font-mono); font-size: 0.85em; }
.hidden { display: none !important; }

.noscript-warning {
    padding: 2rem;
    text-align: center;
    font-size: 1.05rem;
    color: var(--text);
}

/* ------------------------------------------------------------ Responsive -- */
@media (max-width: 900px) {
    .product-detail { grid-template-columns: 1fr; }
}

@media (max-width: 820px) {
    .app-shell,
    .app-shell[data-sidebar-side='right'] {
        grid-template-areas:
            'header'
            'main';
        grid-template-columns: 1fr;
    }

    .app-shell__sidebar {
        position: fixed;
        inset: var(--header-height) auto 0 0;
        width: min(80vw, var(--sidebar-width));
        z-index: 900;
        transform: translateX(-102%);
        box-shadow: var(--shadow-lg);
        transition: transform var(--transition);
    }

    .app-shell[data-sidebar-side='right'] .app-shell__sidebar {
        inset: var(--header-height) 0 0 auto;
        transform: translateX(102%);
    }

    .app-shell[data-mobile-open='true'] .app-shell__sidebar { transform: translateX(0); }

    /* No mobile a sidebar nunca fica "colapsada" — ela é um drawer. */
    .app-shell[data-collapsed='true'] .nav-item__label,
    .app-shell[data-collapsed='true'] .nav-item__badge { display: inline-flex; }

    .app-shell[data-collapsed='true'] .nav-item { justify-content: flex-start; padding: 0.7rem 0.75rem; }

    .header__title { display: none; }

    .toast-region { left: 1rem; right: 1rem; bottom: 1rem; max-width: none; }
}

@media (max-width: 560px) {
    .app-shell__main { padding: 1.25rem 1rem 2.5rem; }
    .product-grid { grid-template-columns: 1fr; }
    .page-header { flex-direction: column; }
    .modal__footer { flex-direction: column-reverse; }
    .modal__footer .btn { width: 100%; }
}
